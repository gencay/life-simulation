name: Evolve simulation

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "simulation.py"
      - "evolution_ticker.py"
      - "test_*.py"
      - ".github/workflows/evolve.yml"
  schedule:
    - cron: "17 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  evolve-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test simulation
        run: python -m unittest -v

      - name: Apply daily draw and advance selected window
        id: evolve
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python simulation.py --event "$EVENT_NAME"

      - name: Commit evolved state and dashboard
        if: steps.evolve.outputs.advanced == 'true'
        run: |
          git config user.name "gencay"
          git config user.email "gencay.ali@hotmail.com"
          git add simulation/ site/data/
          if git diff --cached --quiet; then
            echo "The simulation produced no state change."
          else
            generation="$(python -c 'import json; print(json.load(open("simulation/metrics.json"))["generation"])')"
            git commit -m "simulation: evolve generation ${generation}"
            git push
          fi

      # Republish even on skipped windows so deployment retries need no new generation.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
