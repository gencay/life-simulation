name: Evolve simulation

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-simulation-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test simulation
        run: python -m unittest -v

      - name: Advance simulation
        run: python simulation.py

      - name: Commit evolved state
        run: |
          git config user.name "life-simulation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation/
          if git diff --cached --quiet; then
            echo "The simulation produced no state change."
            exit 0
          fi
          generation="$(python -c 'import json; print(json.load(open("simulation/metrics.json"))["generation"])')"
          git commit -m "simulation: evolve generation ${generation}"
          git push
